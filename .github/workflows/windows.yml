name: Windows

on:
  push:
    branches:
      - windows-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: 'true'
      # The offscreen platform the tests run on looks for fonts in Qt's own
      # lib/fonts, which Qt no longer ships; without any, text has no size
      # and click targets in the views collapse.
      QT_QPA_FONTDIR: 'C:\Windows\Fonts'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Compiler cache kept between runs in the GitHub Actions cache, so a push
      # that touches a few files only recompiles those.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure
        # sccache cannot cache MSVC compiles that use a precompiled header, so
        # PCH is off here; the unity build still batches the sources.
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DHYPRFM_ENABLE_PCH=OFF
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      # -k 0 keeps going past the first failure so one run reports every
      # compile error.
      - name: Build
        run: |
          cmake --build build -- -k 0
          sccache --show-stats

      # A real OpenSSH server on localhost for tst_sftpsession, logging in
      # with a fresh PEM key (the format libssh2 on CNG reads). The runner
      # user is an administrator, so sshd takes the key from
      # administrators_authorized_keys, which must be locked to admins.
      - name: Start SSH server for SFTP tests
        shell: pwsh
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          Start-Service sshd
          $ssh = Join-Path $env:USERPROFILE '.ssh'
          New-Item -ItemType Directory -Force $ssh | Out-Null
          $PSNativeCommandArgumentPassing = 'Standard'   # pass the empty -N '' through
          ssh-keygen -q -m PEM -t rsa -b 3072 -N '' -f "$ssh\id_rsa"
          $auth = 'C:\ProgramData\ssh\administrators_authorized_keys'
          Copy-Item "$ssh\id_rsa.pub" $auth
          icacls $auth /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          "HYPRFM_SFTP_TEST_HOST=localhost" >> $env:GITHUB_ENV
          "HYPRFM_SFTP_TEST_USER=$env:USERNAME" >> $env:GITHUB_ENV

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 180 -j 4

      # ctest swallows the output of these on Windows; run each one directly.
      - name: Rerun failed tests
        if: failure()
        working-directory: build
        shell: pwsh
        run: |
          $log = 'Testing/Temporary/LastTestsFailed.log'
          if (-not (Test-Path $log)) { exit 0 }
          foreach ($line in Get-Content $log) {
            $name = ($line -split ':', 2)[1]
            $exe = "tests/$name.exe"
            if (-not (Test-Path $exe)) { continue }
            "::group::$name"
            $env:QT_QPA_PLATFORM = 'offscreen'
            & $exe -v1 -o "$name.txt,txt" *> "$name.stderr.txt"
            "exit code: $LASTEXITCODE"
            Get-Content "$name.ctest.txt" -ErrorAction SilentlyContinue |
              Select-String -Pattern '^(FAIL!|   Loc:|QFATAL|Totals)' -Context 0,2 | Select-Object -First 30 |
              ForEach-Object { "first run: $_" }
            Get-Content "$name.txt" -ErrorAction SilentlyContinue |
              Select-String -Pattern '^(FAIL!|   Loc:|QFATAL|Totals)' -Context 0,2 | Select-Object -First 60
            Get-Content "$name.stderr.txt" -ErrorAction SilentlyContinue | Select-Object -First 20
            "::endgroup::"
          }

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/*.txt

      - name: Package
        if: always() && hashFiles('build/src/hyprfm.exe') != ''
        shell: pwsh
        run: |
          cmake --install build
          # libssh2 is linked in statically; its headers, .lib and docs are
          # not part of the package.
          Remove-Item -Recurse -Force stage/include, stage/lib, stage/share/doc, stage/share/man `
            -ErrorAction SilentlyContinue
          windeployqt --release --qmldir src/qml --no-translations --no-system-d3d-compiler `
            --no-system-dxc-compiler --no-opengl-sw --no-compiler-runtime `
            --skip-plugin-types qmltooling stage/bin/hyprfm.exe
          # main.cpp forces the Basic style; windeployqt still ships every other
          # Controls style, its DLLs and the native-style backend they share.
          $bin = 'stage/bin'
          foreach ($style in 'FluentWinUI3', 'Fusion', 'Imagine', 'Material', 'Universal', 'Windows') {
            Remove-Item -Recurse -Force "$bin/qml/QtQuick/Controls/$style" -ErrorAction SilentlyContinue
            Remove-Item -Force "$bin/Qt6QuickControls2$style.dll", "$bin/Qt6QuickControls2${style}StyleImpl.dll" `
              -ErrorAction SilentlyContinue
          }
          Remove-Item -Recurse -Force "$bin/qml/QtQuick/NativeStyle" -ErrorAction SilentlyContinue
          # The VC++ runtime next to the exe, so it runs on a PC without the
          # redistributable installed (app-local deployment).
          $crt = Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter 'Microsoft.VC*.CRT' |
                 Select-Object -First 1
          Copy-Item "$($crt.FullName)/*.dll" $bin
          # Everything the exe links must ship or be part of Windows; the
          # runner has OpenSSL on PATH, so the smoke test would not notice.
          $deps = dumpbin /dependents stage/bin/hyprfm.exe | Select-String '\.dll' |
                  ForEach-Object { $_.Line.Trim() }
          $deps
          if ($deps -match 'libcrypto|libssl') { throw 'hyprfm.exe links OpenSSL' }
          Get-ChildItem stage -Recurse -File | Measure-Object -Sum Length |
            ForEach-Object { "Package: {0} files, {1:N1} MB" -f $_.Count, ($_.Sum / 1MB) }

      - name: Smoke test
        if: always() && hashFiles('stage/bin/hyprfm.exe') != ''
        shell: pwsh
        run: |
          # A GUI exe does not block the shell; piping waits for it.
          & stage/bin/hyprfm.exe --version | Out-String
          $env:HYPRFM_TIMING = '1'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $p = Start-Process stage/bin/hyprfm.exe -ArgumentList 'C:/Windows' -PassThru `
                 -RedirectStandardError smoke.err -RedirectStandardOutput smoke.out
          Start-Sleep -Seconds 15
          $alive = -not $p.HasExited
          if ($alive) {
            $mb = [math]::Round($p.WorkingSet64 / 1MB, 1)
            "Running after 15 s, working set $mb MB"
            Stop-Process -Id $p.Id
          } else {
            "Exited early with code $($p.ExitCode)"
          }
          Get-Content smoke.err, smoke.out
          if (-not $alive) { exit 1 }
          # A pruned module shows up as a QML load error, not a crash.
          if (Select-String -Path smoke.err -Pattern 'is not installed|module .* not found|qrc:.*Error' -Quiet) { exit 1 }

      - name: Zip and installer
        id: dist
        if: success()
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(hyprfm VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $version = "$version-$("${{ github.sha }}".Substring(0, 7))"
          New-Item -ItemType Directory -Force dist-out | Out-Null
          Compress-Archive -Path stage/* -DestinationPath "dist-out/HyprFM-$version-portable-x64.zip"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress | Out-Null
            $env:Path += ';C:\Program Files (x86)\Inno Setup 6'
          }
          iscc /Qp "/DAppVersion=$version" "/DStageDir=${{ github.workspace }}\stage" `
               "/Odist-out" dist/windows/hyprfm.iss
          ''   # iscc /Qp leaves its progress line unterminated
          Get-ChildItem dist-out | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload
        if: always() && hashFiles('stage/bin/hyprfm.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: hyprfm-windows-x64
          path: stage

      - name: Upload zip and installer
        if: steps.dist.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hyprfm-windows-dist
          path: dist-out
