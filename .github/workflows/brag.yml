name: Brag video

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "takes (all) or a space-separated list of take names"
        default: ""
  push:
    branches: [brag-video]
    paths: ['brag/**', '.github/workflows/brag.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Setup
        run: |
          pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: sh brag/ci/setup-arch.sh
      - name: Build HyprFM
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build --parallel
          chmod -R a+rX "$GITHUB_WORKSPACE"
      - name: Build demo home
        run: |
          chmod -R a+rX "$GITHUB_WORKSPACE"
          runuser -u ricer -- sh "$GITHUB_WORKSPACE/brag/assets/build-demo-home.sh" /home/ricer
      - name: Record takes
        run: |
          mkdir -p /tmp/out && chown ricer /tmp/out
          timeout 1500 runuser -u ricer -- dbus-run-session -- sh "$GITHUB_WORKSPACE/brag/capture/takes.sh" /tmp/out "$GITHUB_WORKSPACE/build/src/hyprfm" ${{ github.event.inputs.stage }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture
          path: /tmp/out

